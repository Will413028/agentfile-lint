name: Bug report
description: A crash, a wrong exit code, or output that does not match the documentation.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agentfile-lint --version`, or the commit SHA or vendored copy you run.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and config
      description: The exact command, and your `.agentfile-lint.toml` if you have one.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit code
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest files that reproduce it
      description: Paths and contents of the instruction files involved, or a link to a public repository and commit.
